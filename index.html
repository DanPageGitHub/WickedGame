<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eleanor's Wicked Game: an interactive browser-based audio/video artwork." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eleanor's Wicked Game" />
    <meta property="og:description" content="An interactive browser-based audio/video artwork." />
    <meta property="og:url" content="https://danpagegithub.github.io/WickedGame/" />
    <meta property="og:image" content="https://danpagegithub.github.io/WickedGame/media/WickedGameOpenGraph.png" />
    <meta property="og:image:alt" content="Eleanor's Wicked Game preview image" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eleanor's Wicked Game" />
    <meta name="twitter:description" content="An interactive browser-based audio/video artwork." />
    <meta name="twitter:image" content="https://danpagegithub.github.io/WickedGame/media/WickedGameOpenGraph.png" />
    <title>Eleanor's Wicked Game</title>
  </head>
  <body>
    <div class="app" id="app">
      <div class="video-shell" id="video-shell">
        <div class="video-frame">
          <video
            id="main-video"
            class="main-video"
            muted
            loop
            playsinline
            preload="auto"
          ></video>
          <img id="freeze-frame" class="freeze-frame" alt="" aria-hidden="true" />
          <div class="video-flash" aria-hidden="true"></div>
          <div id="facts-overlay" class="facts-overlay" aria-hidden="true">
            <div id="facts-overlay-text" class="facts-overlay__text"></div>
          </div>
          <button id="startup-overlay" class="startup-overlay" type="button" hidden aria-hidden="true" data-state="loading">
            <span class="startup-overlay__spinner" aria-hidden="true"></span>
            <span id="startup-overlay-text" class="startup-overlay__text">Loading the spell...</span>
            <span id="startup-overlay-subtext" class="startup-overlay__subtext">Press Space if you prefer.</span>
          </button>
        </div>
      </div>

      <div id="controls-hint" class="controls-hint" aria-hidden="true">Tab for controls</div>

      <section class="hud" aria-label="Artwork controls">
        <div class="hud__row">
          <button id="start-button" class="hud__button" type="button">Play</button>
          <p id="status" class="hud__status">Ready.</p>
        </div>

        <div class="hud__row hud__row--compact">
          <label class="hud__tempo" for="tempo-slider">
            <span>BPM</span>
            <input id="tempo-slider" type="range" />
          </label>
          <span id="tempo-value" class="hud__value"></span>
        </div>

        <div id="key-help" class="hud__help"></div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
